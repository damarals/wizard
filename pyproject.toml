# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capes-wizard"
version = "1.0.0"
description = "A tool for searching and extracting article metadata from the CAPES Periodicals Portal."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CAPES Research Wizard Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GUI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.1.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
test = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
]

[project.urls]
"Homepage" = "https://github.com/username/capes-wizard"
"Bug Tracker" = "https://github.com/username/capes-wizard/issues"

[project.scripts]
capes-wizard = "wizard.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wizard"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=wizard"
testpaths = ["tests"]