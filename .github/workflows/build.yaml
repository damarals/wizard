name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.6.1
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: |
        poetry install
        poetry add pyinstaller
    
    - name: Build Windows executable
      run: |
        poetry run pyinstaller --name="Wizard" --windowed --icon=resources/icon.ico --add-data="src/wizard/ui/assets;wizard/ui/assets" --clean --noconfirm src/wizard/main.py
    
    - name: Create Windows installer
      run: |
        # Uncomment and configure if using NSIS for installers
        # choco install nsis -y
        # poetry run makensis installer.nsi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: windows-executable
        path: dist/*.exe
        
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.6.1
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: |
        poetry install
        poetry add pyinstaller
    
    - name: Build Linux executable
      run: |
        poetry run pyinstaller --name="Wizard" --windowed --add-data="src/wizard/ui/assets:wizard/ui/assets" --clean --noconfirm src/wizard/main.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: linux-executable
        path: dist/Wizard