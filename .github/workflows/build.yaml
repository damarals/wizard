name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      run: pip install poetry
    
    - name: Install dependencies
      run: |
        poetry install
        poetry add pyinstaller
    
    - name: Build Windows executable
      run: |
        poetry run pyinstaller --name="Wizard" --windowed --icon=resources/icon.ico --clean --noconfirm src/wizard/main.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/*.exe
        
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0
    
    - name: Install Poetry
      run: pip install poetry
    
    - name: Install dependencies
      run: |
        poetry install
        poetry add pyinstaller
    
    - name: Build Linux executable
      run: |
        poetry run pyinstaller --name="Wizard" --windowed --icon=resources/icon.ico --clean --noconfirm src/wizard/main.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-executable
        path: dist/Wizard
        
  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-executable/*.exe
            artifacts/linux-executable/Wizard
          draft: false
          generate_release_notes: true